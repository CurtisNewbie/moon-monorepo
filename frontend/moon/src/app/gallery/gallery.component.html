<div class="mt-5">
    <h3>{{'gallery' | trl:'galleries'}}</h3>

    <div class="mt-3 mb-5">
        <div class="container bootstrap p-3 mt-3 mb-5 shadow" *ngIf="showCreateGalleryDiv">
            <h4 class="mt-2 mb-2">{{'gallery' | trl:'createNew'}}</h4>

            <mat-form-field style="width: 100%;">
                <mat-label>{{'gallery' | trl:'galleryName'}}</mat-label>
                <input matInput type="text" [(ngModel)]="newGalleryName">
                <button *ngIf="newGalleryName" class="btn-close" matSuffix aria-label="Clear"
                    (click)="newGalleryName=''">
                </button>
            </mat-form-field>

            <div class="justify-content-end d-flex">
                <button mat-raised-button class="mt-2" (click)="createGallery()">{{'gallery' | trl:'create'}}</button>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-end mb-2">

        <button mat-raised-button class="m-2"
            (click)="showCreateGalleryDiv=!showCreateGalleryDiv">{{'gallery' | trl:'createGallery'}}</button>
        <button mat-icon-button class="m-1 icon-button-large" (click)="fetchGalleries()"><i
                class="bi bi-arrow-clockwise"></i></button>
    </div>

    <table mat-table [dataSource]="galleries" class="mat-elevation-z8 mb-4" style="width: 100%;" multiTemplateDataRows>

        <ng-container matColumnDef="thumbnail">
            <th mat-header-cell *matHeaderCellDef> <b>Preview</b> </th>
            <td mat-cell *matCellDef="let f" [appImageTooltip]="!env.isMobile() && f.thumbnailUrl ? '' : null"
                [imageUrl]="!env.isMobile() && f.thumbnailUrl ? f.thumbnailUrl : null" matTooltipShowDelay="200">
                <img style="max-height:60px; padding: 5px 0px 5px 0px;" [src]="f.thumbnailUrl" />
            </td>
        </ng-container>

        <ng-container matColumnDef="galleryNo">
            <th mat-header-cell *matHeaderCellDef> Gallery No </th>
            <td mat-cell *matCellDef="let f"> <span class="pl-1 pr-1">{{f.galleryNo}}
                </span></td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Name </th>
            <td mat-cell *matCellDef="let f"> <span class="pl-1 pr-1">{{f.name}} </span></td>
        </ng-container>

        <ng-container matColumnDef="userNo">
            <th mat-header-cell *matHeaderCellDef> User No </th>
            <td mat-cell *matCellDef="let f"> <span class="pl-1 pr-1">{{f.userNo}} </span></td>
        </ng-container>

        <ng-container matColumnDef="createTime">
            <th mat-header-cell *matHeaderCellDef> Create Time </th>
            <td mat-cell *matCellDef="let f"> {{f.createTime }} </td>
        </ng-container>

        <ng-container matColumnDef="updateTime">
            <th mat-header-cell *matHeaderCellDef> Update Time </th>
            <td mat-cell *matCellDef="let f"> {{f.updateTime }} </td>
        </ng-container>

        <ng-container matColumnDef="createBy">
            <th mat-header-cell *matHeaderCellDef> Created By </th>
            <td mat-cell *matCellDef="let f"> {{f.createBy}} </td>
        </ng-container>

        <ng-container matColumnDef="operation">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let f">
                <!-- Compact only. A phone browses on a row tap, so the actions the
                     expanded panel holds need a path of their own here. -->
                <button mat-icon-button [matMenuTriggerFor]="galleryMenu" aria-label="Gallery actions"
                    (click)="$event.stopPropagation()">
                    <i class="bi bi-three-dots-vertical icon-button-large"></i>
                </button>
                <mat-menu #galleryMenu="matMenu">
                    <button mat-menu-item (click)="browse(f.galleryNo)">{{'gallery' | trl:'browse'}}</button>
                    <ng-container *ngIf="f.isOwner">
                        <button mat-menu-item (click)="updateGallery(f.galleryNo, f.name)">{{'gallery' | trl:'update'}}</button>
                        <button mat-menu-item (click)="deleteGallery(f.galleryNo, f.name)">{{'gallery' | trl:'delete'}}</button>
                        <button mat-menu-item (click)="popToGrantAccess(f)">{{'gallery' | trl:'share'}}</button>
                        <button mat-menu-item *ngIf="f.dirFileKey" (click)="openFileDir(f)">{{'gallery' | trl:'directory'}}</button>
                    </ng-container>
                </mat-menu>
            </td>
        </ng-container>

        <ng-container matColumnDef="expandedElement">
            <td mat-cell *matCellDef="let u"
                [attr.colspan]="displayedColumns.length">
                <div class="element-detail" [@detailExpand]="idEquals(u, expandedElement) ? 'expanded' : 'collapsed'">
                    <div class="d-flex flex-wrap gap-2" *ngIf="expandedElement != null">
                        <mat-form-field style="width: 300px;" class="me-2">
                            <mat-label>Name</mat-label>
                            <input matInput type="text" [(ngModel)]="expandedElement.name"
                                [disabled]="!expandedElement.isOwner">
                        </mat-form-field>
                        <div class="d-flex flex-wrap gap-2 mb-3" *ngIf="expandedElement != null">
                            <ng-container *ngIf="u.isOwner">
                                <button mat-raised-button (click)="updateGallery(u.galleryNo, u.name)">
                                    {{'gallery' | trl:'update'}}
                                </button>
                                <button mat-raised-button (click)="deleteGallery(u.galleryNo, u.name)">
                                    {{'gallery' | trl:'delete'}}
                                </button>
                                <button mat-raised-button (click)="popToGrantAccess(u)">
                                    {{'gallery' | trl:'share'}}
                                </button>
                                <ng-container *ngIf="u.dirFileKey">
                                    <button mat-raised-button (click)="openFileDir(u)">
                                        {{'gallery' | trl:'directory'}}
                                    </button>
                                </ng-container>
                            </ng-container>
                            <button mat-raised-button (click)="browse(expandedElement.galleryNo)">
                                {{'gallery' | trl:'browse'}}
                            </button>
                        </div>
                    </div>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"
            class="element-row" [class.expanded-row]="idEquals(row, expandedElement)"
            (click)="env.isMobile()? browse(row.galleryNo) : expandedElement = getExpandedEle(row)"
            [matTooltip]="row.isOwner ? 'Click to expand' : ''">
        </tr>
        <tr mat-row *matRowDef="let element; columns: ['expandedElement'];" class="detail-row">

    </table>

    <app-controlled-paginator (pageChanged)="fetchGalleries()"></app-controlled-paginator>
</div>
